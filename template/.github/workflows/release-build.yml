# Manual release build. Runs tool/build.sh on a CI machine and commits the
# ledger row back, so the next build, local or CI, takes the next code.
name: release-build

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Tier to build
        type: choice
        options: [staging, prod]
        default: staging
      target:
        description: Flutter build target
        type: choice
        options: [appbundle, apk]
        default: appbundle
      version_name:
        description: New versionName (empty keeps the tier's last one)
        required: false

# One release build at a time across the repository. Two concurrent runs would
# read the same ledger and take the same code.
concurrency:
  group: release-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pin the SDK. A different Flutter version is a different binary.
          flutter-version: "3.44.7"
          channel: stable

      - name: Signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties

      - name: Build
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          NOTE: ci run ${{ github.run_id }}
          OUT_DIR: ${{ github.workspace }}/dist
        run: tool/build.sh ${{ inputs.target }} --release --tier ${{ inputs.tier }} --bump

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tier }}-${{ github.run_id }}
          path: dist/

      - name: Record
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add tool/versions.tsv pubspec.lock
          git commit -m "build(${{ inputs.tier }}): record release build"
          git pull --rebase
          git push
